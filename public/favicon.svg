<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ca-red-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff4d4d" />
      <stop offset="50%" stopColor="#ef4444" />
      <stop offset="100%" stopColor="#991b1b" />
    </linearGradient>
    <linearGradient id="ca-red-facet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f87171" />
      <stop offset="60%" stopColor="#dc2626" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>
    <linearGradient id="ca-gold-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#fecaca" />
    </linearGradient>
    <filter id="ca-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="64" height="64" rx="16" fill="#090a0f" />
  <rect width="64" height="64" rx="16" stroke="rgba(239, 68, 68, 0.3)" stroke-width="2" />

  <!-- Monogram CA - Ascending Victory Peak (Variation 1) -->
  <g filter="url(#ca-glow)">
    <!-- 'C' Outer Arc & Left Wing -->
    <path 
      d="M32 10 L16 20 L16 44 L32 54 L32 46 L22 39.5 L22 24.5 L32 18 Z" 
      fill="url(#ca-red-facet)" 
    />

    <!-- 'A' Ascending Victory Blade & Peak -->
    <path 
      d="M32 10 L48 20 L48 44 L32 54 L32 46 L42 39.5 L42 24.5 L32 18 Z" 
      fill="url(#ca-red-main)" 
    />

    <!-- Central Victory Peak A-Blade -->
    <path 
      d="M32 8 L44 32 H37 L32 21 L27 32 H20 L32 8 Z" 
      fill="url(#ca-red-main)" 
    />

    <!-- Sharp Approval Checkmark (Victory Notch) -->
    <path 
      d="M24 38 L30 44 L44 28" 
      stroke="url(#ca-gold-check)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>

